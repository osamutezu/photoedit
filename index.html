<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Analog Image"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>Analog Image Processor</title><style>
:root{color-scheme:dark;font-family:ui-monospace,Menlo,Consolas,monospace;background:#101010;color:#f3f3f3}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:920px;margin:auto;padding:22px 17px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #383838;padding-bottom:16px}h1{font-size:19px;letter-spacing:.09em;margin:0}h2{font-size:13px;letter-spacing:.14em;font-weight:500;margin:26px 0 14px}.sub,.muted{color:#999;font-size:11px;line-height:1.6}.tag{border:1px solid #555;padding:6px 9px;font-size:10px;letter-spacing:.06em}.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.btn,.filebtn{background:#f2f2f2;color:#111;border:1px solid #f2f2f2;padding:12px 14px;font-size:12px;font-weight:700}.btn.secondary{background:transparent;color:#eee;border-color:#777}.filebtn input{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.effect{border:0;background:none;color:inherit;padding:0;text-align:left;min-width:0}.thumb{aspect-ratio:1.28;background:#202020;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.thumb canvas{width:100%;height:100%;object-fit:cover}.thumb .pending{position:absolute;right:8px;top:8px;background:#111c;padding:5px;font-size:9px}.effect:disabled{opacity:.43;cursor:default}.effect .name{font-size:11px;letter-spacing:.03em;margin-top:8px;display:flex;gap:10px;align-items:baseline}.effect .num{color:#777}.effect.active .thumb{border:2px solid #fff}.editor{display:none}.editor.on{display:block}.gallery.off{display:none}.previewWrap{position:sticky;top:0;background:#101010;z-index:3;padding:12px 0 10px}.preview{background:#202020;display:flex;align-items:center;justify-content:center;max-height:49vh;min-height:190px;overflow:hidden}.preview canvas{display:block;max-width:100%;max-height:49vh;width:auto;height:auto;object-fit:contain}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center}.control{margin:20px 0}.control label{display:flex;justify-content:space-between;color:#bbb;font-size:11px;margin-bottom:10px}.control input{width:100%;accent-color:#fff}.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1;border:1px solid #666;background:#1d1d1d;color:#eee;padding:11px 3px;font-size:10px}.seg button.chosen{background:#eee;color:#111}.note{border-top:1px solid #333;margin-top:26px;padding-top:15px}.status{font-size:11px;color:#bfbfbf;min-height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding-left:28px;padding-right:28px}.preview{max-height:55vh}.preview canvas{max-height:55vh}}
</style></head><body><main class="shell"><header><div><h1>ANALOG IMAGE<br>PROCESSOR</h1><div class="sub">WEB EDITION / PROTOTYPE 01</div></div><div class="tag">LOCAL PROCESSING</div></header><section class="gallery" id="gallery"><div class="upload"><label class="filebtn">+ OPEN IMAGE<input type="file" id="file" accept="image/*"></label><span class="sub" id="imageState">写真を選択してください</span></div><h2>SELECT EFFECT</h2><div class="grid" id="cards"></div><p class="sub note">このWeb版は移植の第1段階です。1-BIT DITHER、HALFTONE、ATMOSPHEREのみ動作します。他のエフェクトは順次移植します。画像はサーバーへ送信しません。</p></section><section class="editor" id="editor"><div class="toolbar"><button class="btn secondary" id="back">← GALLERY</button><span class="sub" id="effectTitle"></span></div><div class="previewWrap"><div class="preview"><canvas id="output"></canvas></div><div class="status" id="status"></div></div><div id="styleBlock" hidden><h2>STYLE</h2><div class="seg" id="styles"></div></div><h2>ADJUSTMENTS</h2><div id="controls"></div><div class="actions"><button class="btn" id="save">SAVE IMAGE</button><button class="btn secondary" id="reset">RESET</button><label class="btn secondary">CHANGE PHOTO<input type="file" id="replace" accept="image/*" hidden></label></div><p class="sub note">iPhoneでは保存ボタンから共有・画像保存を選択できます。画像処理は端末内で実行します。</p></section></main><script>
const effects=['1-BIT DITHER','NIGHT VERSION','CRT','ATMOSPHERE','RISOGRAPH','BLOB TRACKING','DATAMOSH','ASCII ART','FILM CAMERA','LOW POLY','HALFTONE','VHS TAPE'];const available=new Set([0,3,10]);const defaults={dither:{threshold:128,scale:1},halftone:{size:7,contrast:100},atmosphere:{exposure:0,saturation:80,bloom:25,grain:12}};let photo=null,current=0,style='DREAMCORE',values={};const $=id=>document.getElementById(id),canvas=$('output'),ctx=canvas.getContext('2d',{willReadFrequently:true});let source=document.createElement('canvas');const sctx=source.getContext('2d',{willReadFrequently:true});const thumbCanvases=[];
function renderCards(){const host=$('cards');host.innerHTML='';effects.forEach((name,i)=>{let b=document.createElement('button');b.className='effect';b.disabled=!available.has(i);b.innerHTML=`<div class="thumb"><canvas width="240" height="188"></canvas>${available.has(i)?'':'<span class="pending">COMING SOON</span>'}</div><div class="name"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${name}</span></div>`;host.appendChild(b);thumbCanvases[i]=b.querySelector('canvas');b.onclick=()=>openEffect(i)});updateThumbs()}
function loadFile(file){if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let scale=Math.min(1,1800/Math.max(im.width,im.height));source.width=Math.max(1,Math.round(im.width*scale));source.height=Math.max(1,Math.round(im.height*scale));sctx.drawImage(im,0,0,source.width,source.height);photo=true;$('imageState').textContent=file.name;URL.revokeObjectURL(url);updateThumbs();if($('editor').classList.contains('on'))render()};im.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};im.src=url}
$('file').onchange=e=>loadFile(e.target.files[0]);$('replace').onchange=e=>loadFile(e.target.files[0]);function openEffect(i){if(!photo){$('file').click();return}current=i;values={...defaults[i===0?'dither':i===10?'halftone':'atmosphere']};style='DREAMCORE';$('gallery').classList.add('off');$('editor').classList.add('on');$('effectTitle').textContent=effects[i];$('styleBlock').hidden=i!==3;makeControls();render();window.scrollTo(0,0)}$('back').onclick=()=>{$('gallery').classList.remove('off');$('editor').classList.remove('on');updateThumbs()};$('reset').onclick=()=>{values={...defaults[current===0?'dither':current===10?'halftone':'atmosphere']};makeControls();render()};
const specs={0:[['threshold','THRESHOLD',0,255,1],['scale','PIXEL SCALE',1,10,1]],10:[['size','DOT SIZE',2,18,1],['contrast','CONTRAST',40,180,1]],3:[['exposure','EXPOSURE',-70,70,1],['saturation','SATURATION',0,200,1],['bloom','BLOOM',0,100,1],['grain','GRAIN',0,60,1]]};function makeControls(){let c=$('controls');c.innerHTML='';(specs[current]||[]).forEach(([key,label,min,max,step])=>{let wrap=document.createElement('div');wrap.className='control';let lab=document.createElement('label');lab.textContent=label;let val=document.createElement('span');val.textContent=values[key];lab.appendChild(val);let inp=document.createElement('input');inp.type='range';Object.assign(inp,{min,max,step,value:values[key]});inp.oninput=()=>{values[key]=+inp.value;val.textContent=inp.value;requestRender()};wrap.append(lab,inp);c.append(wrap)});let st=$('styles');st.innerHTML='';['DREAMCORE','BACKROOMS','LIMINAL SPACE'].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=x===style?'chosen':'';b.onclick=()=>{style=x;makeControls();render()};st.append(b)})}
let renderRequest=0;function requestRender(){cancelAnimationFrame(renderRequest);renderRequest=requestAnimationFrame(render)}function render(){if(!photo)return;canvas.width=source.width;canvas.height=source.height;ctx.drawImage(source,0,0);let img=ctx.getImageData(0,0,canvas.width,canvas.height);apply(img,current,values,style);ctx.putImageData(img,0,0);$('status').textContent=`${canvas.width} × ${canvas.height} px · ${effects[current]}${current===3?' / '+style:''}`}
function clamp(x){return Math.max(0,Math.min(255,x))}function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}function apply(img,e,v,sty){let d=img.data,w=img.width,h=img.height;if(e===0){let scale=v.scale||1,threshold=v.threshold??128;let bw=new Uint8ClampedArray(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4;bw[y*w+x]=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2]}for(let y=0;y<h;y++)for(let x=0;x<w;x++){let sx=Math.floor(x/scale)*scale,sy=Math.floor(y/scale)*scale;let old=bw[sy*w+sx];let bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]][Math.floor(sy/scale)%4][Math.floor(sx/scale)%4];let out=old+(bayer-7.5)*9>threshold?255:0;let i=(y*w+x)*4;d[i]=d[i+1]=d[i+2]=out}return}if(e===10){let step=v.size||7,contrast=(v.contrast||100)/100;let orig=new Uint8ClampedArray(d);d.fill(245);for(let cy=step/2;cy<h;cy+=step)for(let cx=step/2;cx<w;cx+=step){let sx=Math.min(w-1,Math.floor(cx)),sy=Math.min(h-1,Math.floor(cy)),i=(sy*w+sx)*4,lum=(.2126*orig[i]+.7152*orig[i+1]+.0722*orig[i+2]-128)*contrast+128;let radius=Math.sqrt(Math.max(0,1-clamp(lum)/255))*step*.7;for(let y=Math.max(0,Math.floor(cy-radius));y<Math.min(h,Math.ceil(cy+radius));y++)for(let x=Math.max(0,Math.floor(cx-radius));x<Math.min(w,Math.ceil(cx+radius));x++){if((x-cx)**2+(y-cy)**2<=radius**2){let k=(y*w+x)*4;d[k]=d[k+1]=d[k+2]=22;d[k+3]=255}}}return}if(e===3){let sat=(v.saturation??80)/100,exp=(v.exposure||0)*1.3,grain=v.grain||0,bloom=(v.bloom||0)/100;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2],lum=.2126*r+.7152*g+.0722*b;let glow=Math.max(0,lum-135)*bloom*.5;let noise=(hash(x,y)-.5)*grain;let rr=lum+(r-lum)*sat+exp+glow+noise,gg=lum+(g-lum)*sat+exp+glow+noise,bb=lum+(b-lum)*sat+exp+glow+noise;if(sty==='DREAMCORE'){rr=rr*.96+11;gg=gg*1.02+7;bb=bb*1.08+11}else if(sty==='BACKROOMS'){rr=rr*1.08+12;gg=gg*1.06+10;bb=bb*.67+3;let flicker=Math.sin(y*.09)*4;rr+=flicker;gg+=flicker}else{rr=rr*.91+17;gg=gg*.96+17;bb=bb*1.03+18}d[i]=clamp(rr);d[i+1]=clamp(gg);d[i+2]=clamp(bb)}return}}
function updateThumbs(){thumbCanvases.forEach((c,i)=>{if(!c)return;let t=c.getContext('2d');t.fillStyle='#242424';t.fillRect(0,0,c.width,c.height);if(!photo)return;let scale=Math.max(c.width/source.width,c.height/source.height),ww=source.width*scale,hh=source.height*scale;t.drawImage(source,(c.width-ww)/2,(c.height-hh)/2,ww,hh);if(available.has(i)){let img=t.getImageData(0,0,c.width,c.height);apply(img,i,defaults[i===0?'dither':i===10?'halftone':'atmosphere'],'DREAMCORE');t.putImageData(img,0,0)}})}
$('save').onclick=()=>{canvas.toBlob(async blob=>{if(!blob)return;let file=new File([blob],'analog-image.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Analog Image Processor'});return}}catch(e){if(e.name==='AbortError')return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='analog-image.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),20000)},'image/png')};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderCards();
</script></body></html>
