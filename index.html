function applyGeneral(canvas,g){if(g.brightness===0&&g.contrast===100&&g.saturation===100)return;const c=canvas.getContext('2d',{willReadFrequently:true}),im=c.getImageData(0,0,canvas.width,canvas.height),d=im.data;for(let i=0;i<d.length;i+=4){const l=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];for(let k=0;k<3;k++){const sat=l+(d[i+k]-l)*g.saturation/100;d[i+k]=Math.max(0,Math.min(255,(sat-127.5)*g.contrast/100+127.5+g.brightness*1.5))}}c.putImageData(im,0,0)}
$('effectTab').onclick=()=>{optionsTab='effect';makeControls()};$('generalTab').onclick=()=>{optionsTab='general';makeControls()};

// Export is encoded from the exact preview pixels, as in v7. The export canvas
// is always the same size for every format; no additional effect pass is run.
const EXPORT_KEYS=['smart','lossless','high','png'];
const formatSize=n=>n==null?'—':n>=1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(0)+' KB';
const canvasBlob=(c,type,quality)=>new Promise(resolve=>c.toBlob(resolve,type,quality));
function exportCanvas(){
  const w=original.width,h=original.height,scale=Math.min(1,3200/Math.max(w,h));
  const out=make(Math.max(1,Math.round(w*scale)),Math.max(1,Math.round(h*scale)));
  const ctx=out.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(canvas,0,0,out.width,out.height);return out;
}
function renderExportChoices(){
  const host=$('exportChoices');host.replaceChildren();
  EXPORT_KEYS.forEach(key=>{
    const label=document.createElement('label');label.className='exportChoice';
    const input=document.createElement('input');input.type='radio';input.name='exportMode';input.value=key;input.checked=exportMode===key;
    input.onchange=()=>{exportMode=key;renderExportChoices()};
    const title=document.createElement('span');title.textContent=tr(key);
    const size=document.createElement('span');size.className='size';
    const item=exportCache?.items?.[key];
    size.textContent=exportCache?.busy?tr('calculating'):(item?formatSize(item.blob.size):tr('calculating'));
    label.append(input,title,size);host.appendChild(label);

function scheduleExportSizes(){

  exportTimer=setTimeout(()=>computeExportSizes(serial),350);

async function computeExportSizes(serial){
  if(!original||serial!==exportSerial)return;

    const out=exportCanvas();
    // Yield between encodes to keep the iPhone interface responsive.
    const png=await canvasBlob(out,'image/png');if(!png)throw Error('PNG encoding failed');
    if(serial!==exportSerial)return;
    const webp=await canvasBlob(out,'image/webp',0.95);
    if(serial!==exportSerial)return;
    const jpeg=await canvasBlob(out,'image/jpeg',0.95);
    if(serial!==exportSerial)return;
    const candidates=[{blob:png,mime:'image/png',ext:'png'}];
    if(webp?.type==='image/webp')candidates.push({blob:webp,mime:'image/webp',ext:'webp'});
    if(jpeg?.type==='image/jpeg')candidates.push({blob:jpeg,mime:'image/jpeg',ext:'jpg'});
    const high=candidates.filter(x=>x.mime!=='image/png').sort((a,b)=>a.blob.size-b.blob.size)[0]||candidates[0];

$('save').onclick=async()=>{
  if(!original)return;
  const btn=$('save');btn.disabled=true;btn.textContent=tr('processing');
