async function computeExportSizes(serial){
  if(!original||serial!==exportSerial)return;
  try{
    const out=exportCanvas();
    // Yield between encodes to keep the iPhone interface responsive.
    const png=await canvasBlob(out,'image/png');if(!png)throw Error('PNG encoding failed');
    if(serial!==exportSerial)return;
    const webp=await canvasBlob(out,'image/webp',0.95);
    if(serial!==exportSerial)return;
    const jpeg=await canvasBlob(out,'image/jpeg',0.95);
    if(serial!==exportSerial)return;
    const candidates=[{blob:png,mime:'image/png',ext:'png'}];
    if(webp?.type==='image/webp')candidates.push({blob:webp,mime:'image/webp',ext:'webp'});
    if(jpeg?.type==='image/jpeg')candidates.push({blob:jpeg,mime:'image/jpeg',ext:'jpg'});
    const high=candidates.filter(x=>x.mime!=='image/png').sort((a,b)=>a.blob.size-b.blob.size)[0]||candidates[0];
    // SMART preserves pixel-perfect edges for graphics-heavy effects. For
    // photographic effects, compare high-quality codecs with lossless PNG.
    const graphic=[0,4,5,7,9,10]; // dither, risograph, blob, ASCII, low-poly, halftone
    const smart=graphic.includes(current)?{blob:png,mime:'image/png',ext:'png'}:
      candidates.reduce((best,x)=>x.blob.size<best.blob.size?x:best,candidates[0]);
    exportCache={busy:false,items:{smart,lossless:candidates[0],high,png:candidates[0]}};
    renderExportChoices();
  }catch(e){if(serial===exportSerial){console.error(e);exportCache={busy:false,items:null};renderExportChoices();}}
}
$('save').onclick=async()=>{
  if(!original)return;
  const btn=$('save');btn.disabled=true;btn.textContent=tr('processing');
  try{
    // Flush pending slider edits before encoding the final preview.
    if(renderTimer){clearTimeout(renderTimer);renderTimer=null;render();}
    const serial=exportSerial;
    clearTimeout(exportTimer);
    if(!exportCache?.items)await computeExportSizes(serial);
    if(!exportCache?.items)throw Error('画像の圧縮に失敗しました');
    const item=exportCache.items[exportMode],file=new File([item.blob],`analog-image.${item.ext}`,{type:item.mime});
    if(navigator.canShare?.({files:[file]})){
      try{await navigator.share({files:[file],title:'Analog Image Processor'});return}
      catch(e){if(e.name==='AbortError')return}
    }
    const url=URL.createObjectURL(item.blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){alert('保存に失敗しました: '+e.message)}
  finally{btn.disabled=false;btn.textContent=tr('save')}
};

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=9.0', {updateViaCache:'none'}).catch(console.warn));renderCards();updateLanguage();
